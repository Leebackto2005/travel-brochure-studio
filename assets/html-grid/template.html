<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>
<style>
:root{--frame:@@FRAME@@;--accent:@@ACCENT@@;--paper:@@PAPER@@;--text:@@TEXT@@}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:#dedbd5;color:var(--text);font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page content{size:A4 portrait;margin:0}
@@PAGE_CSS@@
.page{position:relative;width:210mm;height:297mm;margin:8mm auto;background:var(--frame);page:content;break-after:page;box-shadow:0 2mm 6mm #0003}
.page:last-child{break-after:auto}.paper{position:absolute;inset:6mm 6mm 15mm;padding:7mm 6mm 6mm;background:var(--paper)}
.section-pill{min-height:10mm;margin:0 10mm 6mm;padding:2mm 4mm;border-radius:6mm;background:var(--frame);color:var(--paper);text-align:center;font-size:13pt;font-weight:700;line-height:1.3}
.section-pill small{display:block;font:8pt Arial,sans-serif;margin-top:1mm;opacity:.85}main{display:flow-root}footer{position:absolute;left:12mm;right:12mm;bottom:5mm;display:flex;justify-content:space-between;gap:5mm;color:var(--paper);font-size:7pt;line-height:1.3}footer b{white-space:nowrap;font:8pt Arial,sans-serif}
h2,h3,p{margin:0}h2{font-size:11pt;color:var(--frame);line-height:1.4;margin-bottom:2mm}h2 small{display:block;font-size:8pt;font-weight:400;margin-top:.5mm}p{font-size:10pt;line-height:1.65;margin-bottom:2.4mm;white-space:pre-wrap;overflow-wrap:anywhere}
.block{margin-bottom:4mm}.gallery{display:grid;gap:4mm;align-items:start}.gallery figure{margin:0;min-width:0}figure img{display:block;width:100%;background:#eee7dc}figcaption{padding:1.5mm 0 0;font-size:8.2pt;line-height:1.45;overflow-wrap:anywhere}figcaption strong{font-weight:600}figcaption small{display:block;font-size:7.2pt;margin-top:.6mm;opacity:.8}.image-placeholder{display:flex;width:100%;align-items:center;justify-content:center;padding:3mm;text-align:center;background:#eee7dc;border:.3mm dashed var(--accent);color:var(--text);font-size:9pt;overflow-wrap:anywhere}
.hotel-row{margin:0 0 3.5mm}.hotel-row h2{font-size:10.5pt;margin-bottom:1.5mm}.hotel-row h2 small{display:inline;margin-left:3mm;font:7.5pt Arial,sans-serif}.hotel-row .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.hotel-row figcaption{font-size:7.4pt}.hotel-number{font:12pt Georgia,serif;color:var(--accent);margin-right:2mm}.hotels.compact .hotel-row{margin-bottom:2.5mm}.reference-note{font-size:7.5pt;line-height:1.5;margin:2mm 0 0;opacity:.85}
.day{margin-bottom:5mm}.dayhead{display:flex;align-items:center;gap:3mm;background:var(--frame);color:var(--paper);padding:2.5mm 3mm;margin-bottom:2.5mm}.dayhead em{font:22pt Georgia,serif;white-space:nowrap}.dayhead h2{color:var(--paper);font-size:12.5pt;margin:0}.dayhead small{display:block;font-size:8pt;margin-top:1mm}.flight-strip{background:#f3e8d3;border-left:1mm solid var(--accent);padding:2.5mm 3mm;margin:0 0 3mm;font-size:10pt;font-weight:700;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.meal-hotel{padding:2mm 3mm;background:#f3eee4;font-size:8.5pt;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.meal-hotel div+div{margin-top:1mm}.notice h3{font-size:11pt;color:var(--frame);border-bottom:.3mm solid var(--accent);padding-bottom:1.5mm;margin-bottom:2.5mm}.notice p{font-size:9.5pt;line-height:1.65}.data-table{width:100%;border-collapse:collapse;font-size:9pt;line-height:1.5;table-layout:fixed}.data-table th,.data-table td{border:.25mm solid var(--accent);padding:2mm;vertical-align:top;overflow-wrap:anywhere;white-space:pre-wrap}.data-table th{background:#f2e8d7;font-weight:600}
.cover{padding:0;overflow:hidden}.cover>img{display:block;width:100%;height:100%;object-fit:contain}.cover>.image-placeholder{height:100%}.cover.poster>img{object-fit:contain}
@media print{html,body{background:white}.page{margin:0;box-shadow:none}}
</style>
</head>
<body>@@PAGES@@</body>
</html>
